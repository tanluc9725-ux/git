<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Registration Form | Final</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="register-wrapper">
    <section class="form-container">
        <header>
            <h1>Đăng ký tài khoản</h1>
        </header>

        <!-- Method POST để bảo mật, Action gửi về email -->
        <form id="registrationForm" action="mailto:admin@example.com" method="POST" enctype="text/plain">
            
            <div class="input-group">
                <div class="field">
                    <label for="fname">Họ</label>
                    <input type="text" id="fname" name="firstname" placeholder="Nguyễn" required>
                </div>
                <div class="field">
                    <label for="lname">Tên</label>
                    <input type="text" id="lname" name="lastname" placeholder="An" required>
                </div>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="user_email" placeholder="student@example.com" required>
            </div>

            <div class="field">
                <label for="password">Mật khẩu</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="user_password" 
                           placeholder="Tối thiểu 6 ký tự" required
                           pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{6,}$">
                    <button type="button" id="btnToggle" class="toggle-btn">Hiện</button>
                </div>
                <!-- Thanh hiển thị độ mạnh yếu -->
                <div id="password-strength" class="strength-meter"></div>
                <small>Yêu cầu: 6+ ký tự, có chữ, số và ký tự đặc biệt.</small>
            </div>

            <div class="field">
    <label for="birthday">Ngày sinh</label>
    <input type="date"id="birthday" name="user_birthday" min="1997-01-01" max="2026-12-31" required>

           id="birthday" 
           <p id="age-display" class="age-text">Tuổi: --</p>
           name="user_birthday" 
           min="1997-01-01" 
           max="2026-12-31" 
           required>
</div>

            <div class="field">
                <label>Giới tính</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="Nam" checked> Nam</label>
                    <label><input type="radio" name="gender" value="Nữ"> Nữ</label>
                    <label><input type="radio" name="gender" value="Khác"> Khác</label>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit"> đăng ký</button>
        </form>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
